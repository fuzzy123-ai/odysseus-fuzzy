services:
  harbour:
    image: localhost/odysseus_odysseus:latest
    container_name: harbour_one_1
    ports:
      - "127.0.0.1:7050:7000"
    volumes:
      - .:/app:z
      - /opt/odysseus/data:/app/data:z
      - /opt/odysseus/logs:/app/logs:z
      - /opt/odysseus/data/ssh:/app/.ssh:z
      - ${UNIVERSAL_INBOX_HOST_PATH:-./data/universal-inbox}:${UNIVERSAL_INBOX_PATH:-/app/universal-inbox}:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /opt/odysseus/.env
    environment:
      - LLM_HOST=${LLM_HOST:-ollama}
      - LLM_HOSTS=${LLM_HOSTS:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=sqlite:////app/data/app.db
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ODYSSEUS_TOOL_CATALOG_V2_ENABLED=true
      - HARBOUR_MCP_FIRST_ENABLED=true
      - ODYSSEUS_INTERNAL_TOKEN=${ODYSSEUS_INTERNAL_TOKEN:-}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,https://harbour.katzarow.de}
      - SECURE_COOKIES=false
      - ODYSSEUS_INPROCESS_POLLERS=1
      - ODYSSEUS_INPROCESS_TASKS=1
    restart: unless-stopped
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "3"
