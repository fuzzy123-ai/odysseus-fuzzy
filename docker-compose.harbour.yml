services:
  harbour:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
        INSTALL_OFFICE: ${INSTALL_OFFICE:-false}
        INSTALL_STT: ${INSTALL_STT:-false}
        INSTALL_OCR: ${INSTALL_OCR:-false}
        ODYSSEUS_RELEASE_REVISION: ${ODYSSEUS_RELEASE_REVISION:-v2026.10-harbour-mcp-first}
    container_name: harbour_one_1
    ports:
      - "127.0.0.1:7050:7000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      - ${UNIVERSAL_INBOX_HOST_PATH:-./data/universal-inbox}:${UNIVERSAL_INBOX_PATH:-/app/universal-inbox}:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-ollama}
      - LLM_HOSTS=${LLM_HOSTS:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ODYSSEUS_TOOL_CATALOG_V2_ENABLED=true
      - HARBOUR_MCP_FIRST_ENABLED=true
      - ODYSSEUS_INTERNAL_TOKEN=${ODYSSEUS_INTERNAL_TOKEN:-}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,https://harbour.katzarow.de}
      - SECURE_COOKIES=false
      - ODYSSEUS_INPROCESS_POLLERS=1
      - ODYSSEUS_INPROCESS_TASKS=1
    restart: unless-stopped
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "3"
