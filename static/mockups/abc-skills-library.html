<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Skills Library Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02060d;
      --ink: #d7f7ff;
      --muted: #7ea4b5;
      --cyan: #16d9f5;
      --blue: #4b8cff;
      --green: #4ade80;
      --amber: #f7b955;
      --red: #ff5c73;
      --font: "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      --mono: "Fira Code", "SFMono-Regular", Consolas, monospace;
    }

    @font-face {
      font-family: "Fira Code";
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url("../fonts/FiraCode-Regular.woff2") format("woff2");
    }

    @font-face {
      font-family: "Fira Code";
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url("../fonts/FiraCode-SemiBold.woff2") format("woff2");
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }

    button,
    input {
      color: inherit;
      font: inherit;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 18%, color-mix(in srgb, var(--blue) 18%, transparent), transparent 28%),
        radial-gradient(circle at 78% 78%, color-mix(in srgb, var(--cyan) 13%, transparent), transparent 31%),
        var(--bg);
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stage::before {
      z-index: -2;
      background:
        linear-gradient(118deg, transparent 0 18%, color-mix(in srgb, var(--cyan) 5%, transparent) 29%, transparent 40%),
        linear-gradient(72deg, transparent 0 52%, color-mix(in srgb, var(--blue) 8%, transparent) 64%, transparent 74%);
    }

    .stage::after {
      z-index: -1;
      background: repeating-linear-gradient(180deg, color-mix(in srgb, var(--ink) 3.5%, transparent) 0 1px, transparent 1px 5px);
      opacity: 0.15;
      mix-blend-mode: screen;
    }

    .topline {
      position: fixed;
      top: 16px;
      left: 18px;
      right: 18px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand {
      color: var(--cyan);
      font: 600 18px var(--mono);
      text-shadow: 0 0 20px color-mix(in srgb, var(--cyan) 45%, transparent);
    }

    .mode-note {
      color: color-mix(in srgb, var(--muted) 78%, transparent);
      font: 11px var(--mono);
    }

    .window {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(1120px, calc(100vw - 56px));
      height: min(706px, calc(100dvh - 86px));
      transform: translate(-50%, -50%);
      border: 1px solid color-mix(in srgb, var(--cyan) 44%, transparent);
      border-radius: 7px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 97%, var(--cyan) 3%), color-mix(in srgb, var(--bg) 95%, transparent)),
        var(--bg);
      box-shadow:
        0 24px 80px color-mix(in srgb, var(--bg) 72%, transparent),
        0 0 46px color-mix(in srgb, var(--cyan) 11%, transparent);
      overflow: hidden;
    }

    .window-head {
      height: 50px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid color-mix(in srgb, var(--cyan) 16%, transparent);
      padding: 0 16px;
    }

    .title {
      text-align: center;
      font: 600 13px var(--mono);
      color: color-mix(in srgb, var(--ink) 94%, transparent);
    }

    .head-left,
    .head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .head-right { justify-content: flex-end; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      border: 1px solid color-mix(in srgb, var(--cyan) 22%, transparent);
      border-radius: 5px;
      background: color-mix(in srgb, var(--cyan) 8%, var(--bg) 56%);
      color: color-mix(in srgb, var(--ink) 82%, transparent);
      padding: 0 8px;
      font: 10px var(--mono);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px color-mix(in srgb, var(--green) 64%, transparent);
    }

    .icon-control {
      border: 0;
      background: transparent;
      color: var(--cyan);
      font: 17px var(--mono);
      cursor: pointer;
      opacity: 0.82;
    }

    .body {
      height: calc(100% - 50px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 14px 16px 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(200px, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .filters {
      display: inline-flex;
      border: 1px solid color-mix(in srgb, var(--cyan) 18%, transparent);
      border-radius: 5px;
      overflow: hidden;
      width: max-content;
    }

    .filter {
      border: 0;
      border-right: 1px solid color-mix(in srgb, var(--cyan) 13%, transparent);
      background: color-mix(in srgb, var(--cyan) 6%, var(--bg) 62%);
      color: color-mix(in srgb, var(--muted) 84%, transparent);
      padding: 8px 12px;
      font: 11px var(--mono);
      cursor: pointer;
    }

    .filter:last-child { border-right: 0; }

    .filter.active {
      background: color-mix(in srgb, var(--cyan) 11%, transparent);
      color: var(--cyan);
    }

    .filter.review {
      color: var(--amber);
    }

    .search {
      width: 100%;
      border: 1px solid color-mix(in srgb, var(--cyan) 18%, transparent);
      border-radius: 5px;
      background: color-mix(in srgb, var(--bg) 75%, transparent);
      padding: 8px 10px;
      color: color-mix(in srgb, var(--ink) 90%, transparent);
      font: 11px var(--mono);
    }

    .content {
      min-height: 0;
      display: grid;
      grid-template-columns: 370px minmax(0, 1fr);
      gap: 12px;
    }

    .pane {
      min-height: 0;
      border: 1px solid color-mix(in srgb, var(--cyan) 16%, transparent);
      border-radius: 7px;
      background: color-mix(in srgb, var(--bg) 68%, transparent);
      overflow: hidden;
    }

    .skill-list,
    .skill-detail {
      height: 100%;
      overflow: auto;
    }

    .skill-row {
      width: 100%;
      display: grid;
      grid-template-columns: 13px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--cyan) 8%, transparent);
      background: transparent;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
    }

    .skill-row:hover,
    .skill-row.active {
      background: linear-gradient(90deg, color-mix(in srgb, var(--cyan) 8%, transparent), color-mix(in srgb, var(--cyan) 2%, transparent), transparent);
    }

    .health-dot {
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border: 1px solid currentColor;
      border-radius: 50%;
      color: var(--green);
      box-shadow: 0 0 10px currentColor;
    }

    .health-dot.review { color: var(--amber); }
    .health-dot.draft { color: var(--blue); }
    .health-dot.blocked { color: var(--red); }

    .skill-row strong {
      display: block;
      color: color-mix(in srgb, var(--ink) 94%, transparent);
      font: 600 12px var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-row span {
      display: block;
      margin-top: 4px;
      color: color-mix(in srgb, var(--muted) 78%, transparent);
      font: 11px/1.35 var(--font);
    }

    .category {
      border: 1px solid color-mix(in srgb, var(--cyan) 16%, transparent);
      border-radius: 5px;
      color: color-mix(in srgb, var(--muted) 84%, transparent);
      padding: 3px 7px;
      font: 9px var(--mono);
    }

    .skill-detail {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      padding: 16px 16px 0;
      overflow: hidden;
    }

    .detail-head {
      display: grid;
      gap: 7px;
      padding-bottom: 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--cyan) 12%, transparent);
    }

    .detail-head span {
      color: var(--cyan);
      font: 10px var(--mono);
    }

    .detail-head strong {
      color: color-mix(in srgb, var(--ink) 96%, transparent);
      font: 600 20px var(--mono);
    }

    .health-panel {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--cyan) 12%, transparent);
    }

    .health-cell {
      min-height: 54px;
      border: 1px solid color-mix(in srgb, var(--cyan) 11%, transparent);
      border-radius: 5px;
      background: color-mix(in srgb, var(--cyan) 5%, var(--bg) 40%);
      padding: 9px 10px;
      display: grid;
      gap: 5px;
    }

    .health-cell span {
      color: color-mix(in srgb, var(--muted) 86%, transparent);
      font: 600 10px var(--mono);
      text-transform: uppercase;
    }

    .health-cell strong {
      color: color-mix(in srgb, var(--ink) 92%, transparent);
      font: 600 12px var(--mono);
    }

    .health-cell p {
      margin: 0;
      color: color-mix(in srgb, var(--ink) 78%, transparent);
      font: 11px/1.35 var(--font);
    }

    .health-cell.ready strong { color: var(--green); }
    .health-cell.review strong { color: var(--amber); }
    .health-cell.draft strong { color: var(--blue); }
    .health-cell.blocked strong { color: var(--red); }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px 0;
      overflow: auto;
      min-height: 0;
    }

    .section {
      border: 1px solid color-mix(in srgb, var(--cyan) 10%, transparent);
      border-radius: 5px;
      background: color-mix(in srgb, var(--cyan) 5%, var(--bg) 38%);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .section.wide {
      grid-column: 1 / -1;
    }

    .section h3 {
      margin: 0;
      color: color-mix(in srgb, var(--muted) 86%, transparent);
      font: 600 10px var(--mono);
      text-transform: uppercase;
    }

    .section p,
    .section li {
      color: color-mix(in srgb, var(--ink) 84%, transparent);
      font: 12px/1.45 var(--font);
    }

    .section p,
    .section ul {
      margin: 0;
    }

    .section ul {
      padding-left: 17px;
    }

    .never {
      color: var(--red);
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 0 16px;
      border-top: 1px solid color-mix(in srgb, var(--cyan) 10%, transparent);
      background: color-mix(in srgb, var(--bg) 97%, transparent);
    }

    .action-btn {
      border: 1px solid color-mix(in srgb, var(--cyan) 22%, transparent);
      border-radius: 5px;
      background: color-mix(in srgb, var(--cyan) 8%, var(--bg) 64%);
      color: var(--cyan);
      padding: 8px 10px;
      font: 10px var(--mono);
      cursor: pointer;
    }

    .action-btn.primary {
      border-color: color-mix(in srgb, var(--green) 32%, transparent);
      color: var(--green);
    }

    @media (max-width: 920px) {
      body { overflow: auto; }
      .stage { min-height: 100dvh; height: auto; overflow: visible; }
      .window {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: calc(100vw - 24px);
        height: auto;
        min-height: calc(100dvh - 72px);
        margin: 58px 12px 14px;
      }
      .toolbar,
      .content,
      .detail-grid,
      .health-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <header class="topline">
      <div class="brand">ABC</div>
      <div class="mode-note">UI mockup · global skill library</div>
    </header>

    <section class="window" aria-label="Skills Library">
      <header class="window-head">
        <div class="head-left">
          <span class="chip"><span class="dot"></span>8 skills · 3 need review</span>
        </div>
        <div class="title">Skills</div>
        <div class="head-right">
          <button class="icon-control" aria-label="Minimize">-</button>
          <button class="icon-control" aria-label="Maximize">□</button>
          <button class="icon-control" aria-label="Close">x</button>
        </div>
      </header>

      <div class="body">
        <section class="toolbar">
          <nav class="filters" aria-label="Skill filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="cloud">Cloud</button>
            <button class="filter" data-filter="memory">Memory</button>
            <button class="filter" data-filter="projects">Projects</button>
            <button class="filter" data-filter="code">Code</button>
            <button class="filter" data-filter="automation">Automation</button>
            <button class="filter review" data-filter="review">Needs review</button>
          </nav>
          <input class="search" placeholder="Search skills, actions, rules, tools">
          <span class="chip">Rules editable here</span>
        </section>

        <section class="content">
          <aside class="pane skill-list" aria-label="Skill list"></aside>
          <section class="pane skill-detail" aria-label="Selected skill detail">
            <div class="detail-head">
              <span data-skill-category>Cloud</span>
              <strong data-skill-name>Project Archivist</strong>
            </div>
            <div class="health-panel" aria-label="Skill health">
              <article class="health-cell" data-health-cell>
                <span>Skill Health</span>
                <strong data-skill-health>Ready</strong>
                <p data-skill-health-reason></p>
              </article>
              <article class="health-cell" data-trust-cell>
                <span>Trust</span>
                <strong data-skill-trust>High</strong>
                <p data-skill-trust-reason></p>
              </article>
              <article class="health-cell">
                <span>Last checked</span>
                <strong data-skill-checked>Today</strong>
                <p data-skill-review-action></p>
              </article>
            </div>
            <div class="detail-grid">
              <article class="section wide">
                <h3>Purpose</h3>
                <p data-skill-purpose></p>
              </article>
              <article class="section">
                <h3>Used when</h3>
                <p data-skill-used></p>
              </article>
              <article class="section">
                <h3>Allowed</h3>
                <ul data-skill-allowed></ul>
              </article>
              <article class="section">
                <h3>Never</h3>
                <ul class="never" data-skill-never></ul>
              </article>
              <article class="section">
                <h3>Recent activity</h3>
                <p data-skill-activity></p>
              </article>
              <article class="section wide">
                <h3>Rules</h3>
                <p data-skill-rules></p>
              </article>
            </div>
            <div class="actions">
              <button class="action-btn primary">Run skill review</button>
              <button class="action-btn">Edit skill rules</button>
              <button class="action-btn">Open activity</button>
              <button class="action-btn">Disable skill</button>
            </div>
          </section>
        </section>
      </div>
    </section>
  </main>

  <script>
    const skills = [
      {
        id: 'project-archivist',
        name: 'Project Archivist',
        category: 'cloud',
        summary: 'Keeps project material organized and connected.',
        purpose: 'Keeps project material organized, connects related files, and creates concise summaries without changing source documents.',
        used: 'When new notes, meeting files, research exports, or loose documents appear near an active project.',
        allowed: ['Move loose files into project folders', 'Add tags', 'Create summaries', 'Link related files'],
        never: ['Delete originals', 'Share files externally', 'Rewrite source documents without versioning'],
        activity: 'Last run: organized Project Atlas 12 min ago.',
        rules: 'May organize project folders automatically when every move is logged and reversible.',
        health: 'ready',
        healthLabel: 'Ready',
        trust: 'High',
        checked: '12 min ago',
        healthReason: 'Recent run completed cleanly and all file moves were reversible.',
        trustReason: '42 logged actions, no conflicts, no protected folder touched.',
        reviewAction: 'No action needed.'
      },
      {
        id: 'invoice-sorter',
        name: 'Invoice Sorter',
        category: 'cloud',
        summary: 'Recognizes invoices and makes finance files searchable.',
        purpose: 'Reads invoice metadata, adds useful tags, and creates summaries for search and review.',
        used: 'When PDFs or scans look like invoices, receipts, licenses, or recurring service bills.',
        allowed: ['Read metadata', 'Tag files', 'Create sidecar summaries', 'Flag missing information'],
        never: ['Edit originals', 'Move finance structure', 'Create shares', 'Infer payments as completed'],
        activity: 'Last run: tagged 18 finance PDFs 31 min ago.',
        rules: 'May tag finance documents automatically. Original files and folder structure are protected.',
        health: 'ready',
        healthLabel: 'Ready',
        trust: 'High',
        checked: '31 min ago',
        healthReason: 'Only metadata and tags changed; originals stayed untouched.',
        trustReason: 'Invoice detection matched known vendors and stayed inside finance rules.',

      },
      {
        id: 'duplicate-cleaner',
        name: 'Duplicate Cleaner',
        category: 'cloud',
        summary: 'Finds duplicates and moves likely copies into quarantine.',
        purpose: 'Finds likely duplicate files and makes cleanup reversible instead of destructive.',
        used: 'When files have matching hashes, repeated names, old exports, or duplicated downloads.',
        allowed: ['Compare files', 'Tag duplicates', 'Move likely copies to quarantine', 'Explain confidence'],
        never: ['Delete files directly', 'Merge files', 'Touch originals without backup', 'Hide conflicts'],
        activity: 'Last run: quarantined 6 likely duplicates 1h ago.',
        rules: 'May quarantine duplicates automatically. Direct deletion remains disabled.',
        health: 'review',
        healthLabel: 'Needs review',
        trust: 'Medium',
        checked: '1h ago',
        healthReason: 'One duplicate group had similar names but only partial hash overlap.',
        trustReason: 'The action is reversible, but confidence dropped below the clean-auto threshold.',
        reviewAction: 'Review the flagged group or tighten duplicate matching rules.'
      },
      {
        id: 'meeting-notes-assistant',
        name: 'Meeting Notes Assistant',
        category: 'cloud',
        summary: 'Creates summaries and action lists next to raw notes.',
        purpose: 'Turns raw meeting notes into summaries, decisions, and action lists while preserving the source.',
        used: 'When meeting notes, transcripts, or planning documents are added or updated.',
        allowed: ['Create summaries', 'Extract todos', 'Link project files', 'Tag topics'],
        never: ['Move raw notes', 'Overwrite original wording', 'Mark todos done without evidence'],
        activity: 'Last run: created 9 meeting summaries 2h ago.',
        rules: 'May create sidecar files. Raw notes are read-only by default.',
        health: 'ready',
        healthLabel: 'Ready',
        trust: 'High',
        checked: '2h ago',
        healthReason: 'Generated sidecar summaries only; no source note was changed.',
        trustReason: 'User accepted the last two summaries without correction.',
        reviewAction: 'No action needed.'
      },
      {
        id: 'memory-curator',
        name: 'Memory Curator',
        category: 'memory',
        summary: 'Keeps durable memory useful and conflict-aware.',
        purpose: 'Reviews candidate memories, merges duplicates, and flags conflicts only when confidence is low.',
        used: 'When repeated facts, preferences, project decisions, or contradictions appear.',
        allowed: ['Suggest durable memories', 'Merge duplicate facts', 'Flag contradictions'],
        never: ['Silently overwrite user intent', 'Store sensitive content without rule permission'],
        activity: 'Last run: merged project UI preferences yesterday.',
        rules: 'Learns from manual corrections and shows review only when uncertain.',
        health: 'review',
        healthLabel: 'Needs review',
        trust: 'Medium',
        checked: 'Yesterday',
        healthReason: 'Two memories describe similar UI preferences with different wording.',
        trustReason: 'The skill should learn from your last correction before merging again.',
        reviewAction: 'Approve which preference wins; the correction becomes training signal.'
      },
      {
        id: 'project-runner',
        name: 'Project Runner',
        category: 'projects',
        summary: 'Turns project roadmaps into visible execution state.',
        purpose: 'Maintains project overview, roadmaps, milestones, and open decisions.',
        used: 'When a project has active plans, blockers, or roadmap updates.',
        allowed: ['Update progress', 'Create todos', 'Surface blockers'],
        never: ['Mark major milestones complete without evidence', 'Delete roadmap history'],
        activity: 'Last run: updated Overview mockup tasks today.',
        rules: 'Can update planning state, but execution changes need logged evidence.',
        health: 'ready',
        healthLabel: 'Ready',
        trust: 'High',
        checked: 'Today',
        healthReason: 'Planning updates were linked to visible roadmap items.',
        trustReason: 'No milestone was marked complete without evidence.',
        reviewAction: 'No action needed.'
      },
      {
        id: 'code-reviewer',
        name: 'Code Reviewer',
        category: 'code',
        summary: 'Reviews code changes for bugs, risks, and missing tests.',
        purpose: 'Finds concrete risks in code changes and keeps comments tied to files and lines.',
        used: 'When code is changed, committed, or prepared for review.',
        allowed: ['Inspect diffs', 'Run local checks', 'Suggest targeted fixes'],
        never: ['Rewrite unrelated files', 'Hide test failures', 'Approve unknown behavior'],
        activity: 'Last run: checked V2 mockup JavaScript today.',
        rules: 'Prioritizes correctness and minimal blast radius over broad refactors.',
        health: 'ready',
        healthLabel: 'Ready',
        trust: 'High',
        checked: 'Today',
        healthReason: 'Last review produced file-specific findings and did not rewrite code.',
        trustReason: 'Uses tests and diffs as evidence before recommending approval.',
        reviewAction: 'No action needed.'
      },
      {
        id: 'automation-monitor',
        name: 'Automation Monitor',
        category: 'automation',
        summary: 'Watches recurring tasks and reports only useful state changes.',
        purpose: 'Tracks background automations, failed jobs, and pending decisions.',
        used: 'When scheduled or unattended work is running.',
        allowed: ['Monitor status', 'Summarize results', 'Escalate failures'],
        never: ['Retry destructive tasks without permission', 'Suppress repeated failures'],
        activity: 'Idle.',
        rules: 'Escalates only when action is needed or confidence drops.',
        health: 'draft',
        healthLabel: 'Draft',
        trust: 'Low',
        checked: 'Not yet checked',
        healthReason: 'This skill is configured but has not passed a review run yet.',
        trustReason: 'It should stay quiet until one test run proves the escalation logic.',
        reviewAction: 'Run skill review before enabling automatic actions.'
      }
    ];

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const list = $('.skill-list');
    let activeFilter = 'all';
    let activeSkill = new URLSearchParams(location.search).get('skill') || 'project-archivist';

    function renderList() {
      const query = $('.search').value.trim().toLowerCase();
      const visible = skills.filter(skill => {
        const matchesFilter = activeFilter === 'all'
          || skill.category === activeFilter
          || (activeFilter === 'review' && skill.health !== 'ready');
        const haystack = [
          skill.name,
          skill.category,
          skill.summary,
          skill.purpose,
          skill.used,
          skill.rules,
          skill.healthLabel,
          skill.trust,
          skill.healthReason,
          skill.trustReason,
          skill.reviewAction
        ].join(' ').toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });
      list.innerHTML = visible.map(skill => (
        '<button class="skill-row' + (skill.id === activeSkill ? ' active' : '') + '" type="button" data-skill="' + skill.id + '">' +
        '<i class="health-dot ' + skill.health + '" aria-hidden="true"></i>' +
        '<span><strong>' + skill.name + '</strong><span>' + skill.summary + '</span></span>' +
        '<span class="category">' + skill.healthLabel + '</span>' +
        '</button>'
      )).join('');
    }

    function renderDetail(id) {
      const skill = skills.find(item => item.id === id) || skills[0];
      activeSkill = skill.id;
      $('[data-skill-category]').textContent = skill.category;
      $('[data-skill-name]').textContent = skill.name;
      const healthCell = $('[data-health-cell]');
      const trustCell = $('[data-trust-cell]');
      healthCell.className = 'health-cell ' + skill.health;
      trustCell.className = 'health-cell ' + skill.health;
      $('[data-skill-health]').textContent = skill.healthLabel;
      $('[data-skill-health-reason]').textContent = skill.healthReason;
      $('[data-skill-trust]').textContent = skill.trust;
      $('[data-skill-trust-reason]').textContent = skill.trustReason;
      $('[data-skill-checked]').textContent = skill.checked;
      $('[data-skill-review-action]').textContent = skill.reviewAction;
      $('[data-skill-purpose]').textContent = skill.purpose;
      $('[data-skill-used]').textContent = skill.used;
      $('[data-skill-allowed]').innerHTML = skill.allowed.map(item => '<li>' + item + '</li>').join('');
      $('[data-skill-never]').innerHTML = skill.never.map(item => '<li>' + item + '</li>').join('');
      $('[data-skill-activity]').textContent = skill.activity;
      $('[data-skill-rules]').textContent = skill.rules;
      renderList();
    }

    $$('.filter').forEach(filter => {
      filter.addEventListener('click', () => {
        activeFilter = filter.dataset.filter;
        $$('.filter').forEach(item => item.classList.toggle('active', item === filter));
        renderList();
      });
    });

    $('.search').addEventListener('input', renderList);

    list.addEventListener('click', event => {
      const row = event.target.closest('[data-skill]');
      if (!row) return;
      renderDetail(row.dataset.skill);
    });

    if (!skills.some(skill => skill.id === activeSkill)) activeSkill = 'project-archivist';
    const initial = skills.find(skill => skill.id === activeSkill);
    if (initial) {
      activeFilter = 'all';
      renderDetail(initial.id);
    }
  </script>
</body>
</html>
