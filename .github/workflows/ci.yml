name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# The reusable workflow checks out and tests the triggering commit with a
# read-only token. Required-check enforcement itself remains a repository
# settings concern; this workflow deliberately performs no remote mutation.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Required quality gate
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read
