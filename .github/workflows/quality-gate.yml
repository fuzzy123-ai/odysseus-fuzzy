name: Reusable quality gate

on:
  workflow_call:

# Every caller must remain read-only. In particular, pull-request code is
# compiled and tested without access to package or repository write scopes.
permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in static/app.js static/js/**/*.js; do
            node --check "$file"
          done

  python-tests:
    name: Shared verifier (full lane)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js for the full verifier lane
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Prepare local test state
        run: mkdir -p data
      - name: Run the complete required regression suite through the shared verifier
        run: python scripts/verify.py --lane full
