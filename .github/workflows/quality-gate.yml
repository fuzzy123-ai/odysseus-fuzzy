name: Reusable quality gate

on:
  workflow_call:

# Every caller must remain read-only. In particular, pull-request code is
# compiled and tested without access to package or repository write scopes.
permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in static/app.js static/js/**/*.js; do
            node --check "$file"
          done

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Provision the pinned Temporal CLI
        shell: bash
        run: |
          TEMPORAL_CLI_VERSION="1.8.0"
          TEMPORAL_CLI_SHA256="896c6132d6d969f84c3f2382a31abd9a67a06ed3008c1a37c3573fe81d730e4a"
          TEMPORAL_CLI_ARCHIVE="${RUNNER_TEMP}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          TEMPORAL_CLI_DIR="${RUNNER_TEMP}/odysseus-temporal-cli-${TEMPORAL_CLI_VERSION}"
          curl --fail --location --show-error --silent \
            --output "$TEMPORAL_CLI_ARCHIVE" \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$TEMPORAL_CLI_SHA256" "$TEMPORAL_CLI_ARCHIVE" | sha256sum --check --
          mkdir -p "$TEMPORAL_CLI_DIR"
          tar -xzf "$TEMPORAL_CLI_ARCHIVE" -C "$TEMPORAL_CLI_DIR"
          chmod +x "$TEMPORAL_CLI_DIR/temporal"
          printf 'ODYSSEUS_TEMPORAL_CLI_PATH=%s\n' "$TEMPORAL_CLI_DIR/temporal" >> "$GITHUB_ENV"
      - name: Verify pinned Temporal CLI capabilities
        run: python -m src.temporal_runtime.config check
      - name: Prepare local test state
        run: mkdir -p data
      - name: Run the complete required regression suite
        run: python -m pytest -q --maxfail=1
