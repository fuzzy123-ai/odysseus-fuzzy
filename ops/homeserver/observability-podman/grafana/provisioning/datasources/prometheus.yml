apiVersion: 1
prune: true

datasources:
  - name: Odysseus Prometheus
    uid: odysseus-prometheus
    type: prometheus
    access: proxy
    url: $PROMETHEUS_URL
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 3.12.0
      timeInterval: 15s
      queryTimeout: 30s

